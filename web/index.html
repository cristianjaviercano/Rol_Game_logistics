<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogiVerse · Piloto</title>
<meta name="description" content="Laboratorio virtual de gestión y logística internacional: juego por roles y cartas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F5EFF'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3ELV%3C/text%3E%3C/svg%3E">
<style>
  body { margin: 0; background: #EEF1F8; color: #14213D; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  a { color: #1F5EFF; } a:hover { color: #1446C8; }
  * { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid #1F5EFF; outline-offset: 2px; }

  /* Aviso de evento */
  .lv-ov { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(11, 19, 32, 0.55); animation: lv-fade 0.25s ease-out; }
  .lv-ov-card { position: relative; overflow: hidden; width: min(560px, 100%); border-radius: 24px; padding: 28px 28px 22px; color: #FFFFFF; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 24px 60px rgba(0,0,0,0.35); animation: lv-pop 0.45s cubic-bezier(.2,1.4,.4,1); }
  .lv-kicker { position: relative; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; opacity: 0.9; }
  .lv-title { position: relative; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.1; }
  .lv-sub { position: relative; font-size: 15px; font-weight: 600; opacity: 0.95; }
  .lv-text { position: relative; font-size: 15px; line-height: 1.5; }
  .lv-ok { position: relative; align-self: flex-end; margin-top: 8px; font: inherit; font-size: 15px; font-weight: 700; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #FFFFFF; color: #14213D; cursor: pointer; }
  .lv-art { position: relative; height: 130px; display: flex; align-items: center; justify-content: center; }
  .lv-glyph { font-size: 92px; line-height: 1; display: inline-block; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35)); }
  .lv-art-spiral .lv-glyph { animation: lv-spin 1.6s linear infinite; }
  .lv-art-spin .lv-glyph { animation: lv-spin 3s linear infinite; }
  .lv-art-pulse .lv-glyph { animation: lv-pulse 1.1s ease-in-out infinite; }
  .lv-art-bounce .lv-glyph { animation: lv-bounce 0.9s ease-in-out infinite; }
  .lv-art-zoom .lv-glyph { animation: lv-zoom 1.4s ease-in-out infinite; }
  .lv-art-sun .lv-glyph { animation: lv-pulse 2s ease-in-out infinite, lv-spin 12s linear infinite; }
  .lv-art-ships .lv-glyph { animation: lv-drift 2.4s ease-in-out infinite; }
  .lv-art-glitch .lv-glyph { animation: lv-glitch 0.6s steps(2) infinite; }
  .lv-sign { font-family: 'Space Grotesk', sans-serif; font-size: 46px; font-weight: 700; padding: 10px 26px; border-radius: 14px; border: 6px solid #FFFFFF; background: repeating-linear-gradient(-45deg, #D62839 0 16px, #A3121F 16px 32px); animation: lv-shake 0.5s ease-in-out infinite; }
  .lv-fx { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .lv-ov-card > *:not(.lv-fx) { z-index: 1; }
  .lv-fx span { position: absolute; top: -10%; display: block; }
  .lv-fx-rain span { width: 2px; height: 26px; background: rgba(255,255,255,0.3); transform: rotate(14deg); animation: lv-rain 0.7s linear infinite; }
  .lv-fx-coinsUp span, .lv-fx-coinsDown span { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; color: rgba(255,255,255,0.75); }
  .lv-fx-coinsUp span { top: auto; bottom: -10%; animation: lv-rise 2.4s linear infinite; }
  .lv-fx-coinsDown span { animation: lv-fall 2.4s linear infinite; }
  .lv-fx-arrows span { top: auto; bottom: -10%; font-size: 22px; color: rgba(255,255,255,0.6); animation: lv-rise 2s linear infinite; }
  .lv-fx-bubbles span { top: auto; bottom: -10%; width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.45); animation: lv-rise 3s ease-in infinite; }
  .lv-fx-smoke span { top: auto; bottom: -10%; width: 40px; height: 40px; border-radius: 50%; background: rgba(20,20,20,0.35); filter: blur(4px); animation: lv-rise 3.2s ease-out infinite; }
  .lv-fx-heat span { top: auto; bottom: 0; width: 3px; height: 40px; background: rgba(255,240,200,0.35); animation: lv-rise 1.8s ease-in-out infinite; }
  @keyframes lv-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes lv-pop { from { opacity: 0; transform: scale(0.8) translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes lv-spin { to { transform: rotate(-360deg); } }
  @keyframes lv-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  @keyframes lv-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
  @keyframes lv-zoom { 0%, 100% { transform: scale(0.9) translateX(-10px); } 50% { transform: scale(1.2) translateX(10px); } }
  @keyframes lv-drift { 0%, 100% { transform: translateX(-24px) rotate(-3deg); } 50% { transform: translateX(24px) rotate(3deg); } }
  @keyframes lv-shake { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes lv-glitch { 0% { transform: translate(0); filter: hue-rotate(0deg); } 50% { transform: translate(-6px, 3px); filter: hue-rotate(160deg); } 100% { transform: translate(5px, -2px); } }
  @keyframes lv-rain { from { transform: translateY(0) rotate(14deg); } to { transform: translateY(520px) rotate(14deg); } }
  @keyframes lv-rise { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(-560px); opacity: 0; } }
  @keyframes lv-fall { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(560px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .lv-ov *, .lv-ov { animation: none !important; } .lv-fx { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
